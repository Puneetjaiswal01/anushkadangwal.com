<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Something new is on the way. Stay tuned.">
  <title>Something New Is Coming Soon</title>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--muted:#a5a9b8;--accent:#d9c5ff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#242039 0%,#11131f 38%,var(--bg) 75%);color:#f7f5fb;padding:24px}
    .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%,#fff9 99%,transparent),radial-gradient(1px 1px at 82% 22%,#fff8 99%,transparent),radial-gradient(1px 1px at 68% 78%,#fff8 99%,transparent),radial-gradient(1px 1px at 24% 72%,#fff7 99%,transparent),radial-gradient(2px 2px at 91% 58%,#d9c5ff99 99%,transparent),radial-gradient(2px 2px at 8% 48%,#d9c5ff88 99%,transparent);opacity:.8}
    main{position:relative;width:min(720px,100%);text-align:center;padding:clamp(36px,8vw,76px) 24px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#ffffff0c,#ffffff03);box-shadow:0 24px 100px #0007;backdrop-filter:blur(12px)}
    .mark{width:54px;height:54px;margin:0 auto 30px;border:1px solid #d9c5ff55;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:23px;box-shadow:0 0 40px #b99cff22}
    .eyebrow{margin:0 0 18px;color:var(--accent);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:650}
    h1{margin:0;font-size:clamp(42px,8vw,76px);line-height:1.02;letter-spacing:-.055em;font-weight:650}
    h1 span{display:block;color:var(--accent)}
    .copy{max-width:430px;margin:24px auto 0;color:var(--muted);font-size:16px;line-height:1.8}
    .rule{width:44px;height:1px;background:#d9c5ff88;margin:34px auto 22px}
    .foot{margin:0;color:#777d90;font-size:12px;letter-spacing:.08em}
    @media(max-width:480px){main{border-radius:22px}.copy{font-size:15px}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">A new chapter begins</p>
    <h1>Something new <span>is coming soon.</span></h1>
    <p class="copy">We’re working on something fresh. The next version is taking shape — check back soon.</p>
    <div class="rule"></div>
    <p class="foot">STAY TUNED · SEE YOU SOON</p>
  </main>
</body>
</html>
