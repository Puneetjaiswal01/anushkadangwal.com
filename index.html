<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Anushka ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff5f7,#ffe7ef,#fff);
  color:#2b2024;overflow:hidden;
}
.card{
  width:min(90%,520px);padding:48px 30px;text-align:center;background:rgba(255,255,255,.78);
  border:1px solid rgba(255,105,140,.18);border-radius:30px;
  box-shadow:0 20px 70px rgba(120,35,65,.12);backdrop-filter:blur(12px);
}
.heart{font-size:52px;animation:pulse 1.5s infinite;margin-bottom:10px}
h1{font-size:clamp(30px,7vw,48px);margin:0 0 14px;font-weight:800}
p{font-size:19px;line-height:1.6;margin:8px 0}
.loading{margin:28px auto 24px;width:180px;height:8px;border-radius:20px;background:#f4d6df;overflow:hidden}
.loading span{display:block;width:45%;height:100%;border-radius:20px;background:#ff5f8a;animation:load 1.5s infinite ease-in-out}
.small{font-size:14px;color:#8b6d78;margin-top:24px}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<main class="card">
  <div class="heart">💗</div>
  <h1>Hey Anushka</h1>
  <p>How are you, love? 🥺</p>
  <p>Wait… something is loading.</p>
  <div class="loading"><span></span></div>
  <p><strong>Please tighten your belt 😌</strong></p>
  <p>Because I may have something very cute planned for you.</p>
  <div class="small">Loading something special… don't peek 👀</div>
</main>
</body>
</html>
