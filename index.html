<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050307">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>♡</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050307;overflow:hidden;display:grid;place-items:center}
main{width:100%;height:100dvh;display:grid;place-items:center}
.heart{width:90px;height:90px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 26px rgba(255,74,130,.34));animation:heartbeat 1.65s ease-in-out infinite}
.heart svg{width:70px;height:70px;overflow:visible}
.heart path{fill:#f47399;stroke:#ffacc5;stroke-width:.8}
.heart:after{content:"";position:absolute;width:122px;height:122px;border:1px solid rgba(255,147,183,.12);border-radius:50%;animation:wave 2.4s ease-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(.9);opacity:.85}25%{transform:scale(1.13);opacity:1}43%{transform:scale(.94)}62%{transform:scale(1.05)}}
@keyframes wave{0%{transform:scale(.65);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.heart,.heart:after{animation:none}}
</style>
</head>
<body>
<main aria-label="Loading"><div class="heart" role="status" aria-label="Loading">
<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 56C25 50 7 37 7 23 7 13 14 7 23 7c5 0 8 3 9 7 2-4 6-7 11-7 9 0 16 6 16 16 0 14-18 27-27 33Z"/></svg>
</div></main>
</body>
</html>
